#Atmospherics
- type: entity
  parent: AirlockAssembly
  id: AirlockAssemblyAtmospherics
  suffix: Atmospherics
  components:
  - type: Sprite
    sprite: _Shiptest/Structures/Doors/Airlocks/standard.rsi
    state: "atmos_open"

- type: entity
  parent: AirlockAssembly
  id: AirlockAssemblyAtmosphericsGlass
  suffix: Atmospherics, Glass
  components:
  - type: Sprite
    sprite: _Shiptest/Structures/Doors/Airlocks/glass.rsi
