- type: entity
  name: kanabou
  parent: [BaseItem, BaseSyndicateContraband]
  id: Kanabou
  description: The classic oni weapon, for those that forgo subtlety.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/kanabou.rsi
    state: icon
  - type: Item
    size: Normal
  - type: MeleeWeapon
    attackRate: 1.3
    range: 1.75
    animationRotation: -135
    heavyStaminaCost: 10
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 14
        Structural: 10
    soundHit:
      path: /Audio/Nyanotrasen/Weapons/club.ogg
  - type: StaminaDamageOnHit
    damage: 20
  - type: MeleeThrowOnHit
    distance: 1
    speed: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 14
        Structural: 10
  - type: Clothing
    sprite: Nyanotrasen/Objects/Weapons/Melee/kanabou.rsi
    quickEquip: false
    slots:
    - back

