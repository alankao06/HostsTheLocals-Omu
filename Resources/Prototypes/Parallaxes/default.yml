- type: parallax
  id: Blank

- type: parallax
  id: Default
  layers:
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Shiptest/Parallaxes/shiptest1.png"
      slowness: 0.998046875
      scale: "1, 1"
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Shiptest/Parallaxes/shiptest2.png"
      scale: "0.75, 0.75"
      slowness: 0.989375
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Shiptest/Parallaxes/shiptest3.png"
      scale: "0.75, 0.75"
      slowness: 0.984352
