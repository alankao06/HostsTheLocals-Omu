- type: entity
  id: StationRadioReceiver
  name: station radio
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  description: Listen to the top hits of your stations local radio.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/StationRadio/stationradio.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    drawdepth: SmallObjects
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.10,0.10,0.10"
        density: 500
        mask:
        - TabletopMachineMask
        layer:
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Machine
    board: StationRadioCircuitboard
  - type: RadioSpeaker
    powerRequired: true
    speakNormally: true
    enabled: true
    channels:
    - RadioShow
  - type: Speech
    speechVerb: StationRadio
  - type: ActiveRadio
    channels:
    - RadioShow
  - type: StationRadioReceiver

- type: entity
  parent: [ BaseWallmountMachine, StationRadioReceiver]
  id: WallStationRadio
  name: station map
  description: A radio affixed to the wall. Great for open expanses
  suffix: Wall
  components:
    - type: WallMount
      arc: 360
    - type: Appearance
    # - type: StationMap
    - type: Sprite
      sprite: Structures/Machines/wallmount_radio.rsi
      layers:
      - state: station_map0
      - state: unshaded
        shader: unshaded
      - type: Machine

- type: entity
  parent: [ BaseWallmountMachine, StationRadioReceiver]
  id: WallStationRadio
  name: wallmount radio
  description: A radio affixed to the wall. Great for open expanses
  suffix: Wall
  components:
    - type: WallMount
      arc: 360
    - type: Appearance
    # - type: StationMap
    - type: Sprite
      sprite: Structures/Machines/wallmount_radio.rsi
      layers:
      - state: station_map0
      - state: unshaded
        shader: unshaded
      - type: Machine

- type: entity
  parent: [ StationRadioReceiver, BaseItem ]
  id: HandheldStationRadio
  name: station map
  description: A radio affixed to the wall. Great for open expanses
  suffix: Wall
  components:
    - type: Appearance
    - type: Sprite
      sprite: Structures/Machines/wallmount_radio.rsi
    # - type: StationMap
      inhandVisuals:
      left:
      - state: advanced-inhand-left
      right:
      - state: advanced-inhand-right
